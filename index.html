<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiet Zone — inside a QR code</title>
    <meta
      name="description"
      content="Scratch, tear or cover a QR code and watch Reed–Solomon error correction put it back. A QR encoder and decoder written from scratch, with every step explained."
    />
    <meta name="author" content="Mustafa Obaid" />
    <meta name="theme-color" content="#fbfbf9" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quiet Zone — inside a QR code" />
    <meta
      property="og:description"
      content="Scratch, tear or cover a QR code and watch Reed–Solomon error correction put it back."
    />
    <meta property="og:url" content="https://mustafaobaidd1.github.io/quiet-zone-qr/" />
    <meta
      property="og:image"
      content="https://mustafaobaidd1.github.io/quiet-zone-qr/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Shown until the app mounts (replaced by it), so there is never a blank flash. */
      html,
      body {
        margin: 0;
        background: #fbfbf9;
        color: #111;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .boot {
        max-width: 1520px;
        margin: 0 auto;
        padding: 0 clamp(16px, 4vw, 56px);
      }
      .boot-bar {
        height: 56px;
        border-bottom: 1px solid #111;
      }
      .boot-title {
        margin: 28px 0 0;
        font-size: clamp(44px, 6.4vw, 84px);
        font-weight: 700;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }
      .boot-box {
        display: grid;
        place-items: center;
        width: min(100%, 640px);
        aspect-ratio: 1;
        margin-top: 24px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
        font:
          13px/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #66665f;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="padding: 24px">
        Quiet Zone needs JavaScript: the QR encoder and decoder run in your browser.
      </p>
    </noscript>
    <div id="app">
      <div class="boot" aria-hidden="true">
        <div class="boot-bar"></div>
        <p class="boot-title">Quiet Zone</p>
        <div class="boot-box">Encoding…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
